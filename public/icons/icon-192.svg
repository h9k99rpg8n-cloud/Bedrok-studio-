    <polygon points="256,104 392,178 256,252 120,178" fill="#6abe30"/>
    <polygon points="120,178 256,252 256,392 120,318" fill="#8a5a2b"/>
    <polygon points="392,178 256,252 256,392 392,318" fill="#6b4423"/>
